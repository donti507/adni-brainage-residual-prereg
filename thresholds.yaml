# thresholds.yaml
status: DRAFT            # becomes FINAL only after Theorist numbers are in
version: 0.7
numeric_tiers_pending_theorist: false   # Theorist log 3eb046d (all VERIFIED)
source_of_truth: Residual_Brain_Age_Proposal_LaTeX.pdf

execution: {count_x1_status: FINAL}
missing_values:
  blank_is_missing: true
  additional_by_column: {pT217_F: [-4]}

units: {month_days: 365, censor_days: 1826}

index:
  anchor: tau_pet
  rule: earliest_tau_scan_meeting_all
  requires: [meta_temporal_suvr_non_missing, qualifying_mri, qualifying_amyloid_pet]
  outcome_data_used: false

windows_days:
  mri_from_index: 180
  amyloid_from_index: 180
  mri_to_amyloid_max: 180     # proposal: MRI-PET interval <= 6 months
  cognition_baseline: 180
  diagnosis_baseline: 180
  plasma_ptau217: 365

selection:
  nearest_by: absolute_days_from_index
  consider_only: [passes_qc, non_missing_required_fields]
  tie_break: [complete_values, earlier_record, lowest_row_id]
  report: [tied_groups, extra_records]

mri:
  source: UCSFFSX7                 # FreeSurfer 7.x, all phases
  required_fields: [hippocampus_left, hippocampus_right, icv, thickness_entorhinal, thickness_fusiform, thickness_inferior_temporal, thickness_middle_temporal]
  columns:
    hippocampus_left: ST29SV
    hippocampus_right: ST88SV
    icv: ST10CV
    thickness_entorhinal:
      left: ST24TA
      right: ST83TA
      require_both_non_missing: true
      aggregation: mean
    thickness_fusiform:
      left: ST26TA
      right: ST85TA
      require_both_non_missing: true
      aggregation: mean
    thickness_inferior_temporal:
      left: ST32TA
      right: ST91TA
      require_both_non_missing: true
      aggregation: mean
    thickness_middle_temporal:
      left: ST40TA
      right: ST99TA
      require_both_non_missing: true
      aggregation: mean
    freesurfer_version: FSVER
    status: STATUS
    hippocampal_qc: HIPPOQC
    temporal_qc: TEMPQC
  qc_flag:
    column: OVERALLQC
    pass_token: "Pass"
    accept_blank_when: {column: STATUS, equals: "partial"}
    excluded_tokens: ["Fail", "Partial", "Hippocampus Only"]
    strict_pass_only_sensitivity: true
    status: USER_SPECIFIED_ROUND_7
    before_cohort_counts: report_STATUS_x_OVERALLQC_and_regional_QC_counts
  freesurfer_version: {report_observed: true, expected_by_phase: null}
  x1_usability_fields: required_fields_only   # X1 counts use the 7 MTL fields only (D-011)
  outlier_rule:                      # D-010
    applies_to: unreviewed           # OVERALLQC blank with STATUS partial
    measures: [hippocampus_total_over_icv, mean_temporal_thickness]
    mad_cutoff: 5
    reference: median_of_all_usable_mri
    sensitivity_without_rule: true

amyloid:
  source: UCBERKELEY_AMY_6MM
  qc_source: AMYQC
  measure: centiloid_global
  negative_rule: {operator: "<", cutoff: 20, status: DECIDED}   # D-010; Red Team may add sensitivity cutoffs only
  columns:
    centiloid_global: CENTILOIDS
    qc:
      column: qc_flag
      pass_value: 2
    amyqc:
      source: AMYQC
      column: SCANQLTY
      pass_value: 1
      join_keys: [RID, VISCODE2, SCANDATE]
      missing_record: not_required
      duplicate_records: ineligible
      conflicting_records: ineligible
      report_scan_counts: [missing_record, one_pass, one_fail, duplicate_records, conflicting_records]
    require_both_qc_sources_pass: true  # AMYQC pass required only where a record exists

tau:
  source: UCBERKELEY_TAU_6MM
  measure: meta_temporal_suvr
  columns:
    meta_temporal_suvr: META_TEMPORAL_SUVR
    qc:
      column: qc_flag
      pass_value: 2

cognition:
  primary_source: UWNPSYCHSUM        # ADNI1-3 only
  sensitivity_source: ADSP_PHC_COGN  # DECIDED D-010: sensitivity only; covers ADNI4
  cdr_source: CDR
  outcomes: [ADNI_MEM, ADNI_EF, CDR_SB]
  baseline: nearest_visit_with_non_missing_outcome
  followups: {after: outcome_baseline, until_days_from_index: 1826, per_outcome: true}
  min_assessments_total: 3           # proposal: >=3 assessments = baseline + 2 follow-ups
  min_span_days: 365
  cohort_requires: at_least_one_outcome

diagnosis:
  source: DXSUM
  CN: {at: diagnosis_baseline}
  MCI: {at: diagnosis_baseline, collapse: [EMCI, LMCI]}
  exclude: [dementia_at_baseline, no_diagnosis_in_window]
  columns:
    diagnosis: DIAGNOSIS
    phase_for_raw_value_counts: PHASE
    no_diagnosis_values: [10]
    other_code_mapping_status: PROVISIONAL_A5
    report: diagnosis_value_counts_per_phase

conversion:
  role: SECONDARY                    # proposal: conversion is secondary
  population: MCI
  time_origin: index_date
  event: first_post_baseline_dementia
  confirmation: {rule: next_diagnosis_visit_only, unconfirmed_flag: true, report_both: true}
  code_mapping: PROVISIONAL_A5      # Aim 2 X1 verdict provisional until A5 confirmed

residual_model:                      # D-001 revised to match proposal sec 5.2
  outcome: corrected_BAG
  terms: [amyloid_centiloid, meta_temporal_tau, age, sex, icv]   # linear only
  robustness_only: [amyloid_x_tau_interaction, nonlinear_terms]
  cross_fit_folds: 5
  outcome_data_used: false

comparators:                         # replaces my M1-M3; PROVISIONAL until X2
  C1: tau_residualised_cortical_thickness   # Ossenkoppele 2020
  C2: mtl_tau_neurodegeneration_mismatch    # Lyu 2024

reserve:
  primary: education
  secondary: occupation_where_recorded
  source: PTDEMOG

covariates_primary: [age, sex, icv, education, amyloid, tau]
apoe4: {source: APOERES, in_primary_model: false, status: DECIDED_SENSITIVITY_ONLY}

multiplicity: {method: FDR_BH, across: outcomes}    # proposal says FDR, not Holm

pass_rule:
  rule: CI_excludes_null_powered_at_smallest_effect_of_interest
  point_estimate_threshold: false    # Chat B: old rule passed only 50% at true effect
  delta_cindex: exploratory_unless_theorist_shows_powered

brain_age_training_pool:
  model: ridge
  population: CN_amyloid_negative
  amyloid_within_days_of_mri: 180
  cn_at_mri: {diagnosis_within_days: 180}
  exclude_if_any_later_non_cn: true
  exclude_rids: all_rids_with_index_eligible_scan
  one_mri_per_rid: earliest_usable
  min_n: 300                         # JUDGMENT, not derived; Chat B to rule
  fallback: NONE                     # cross-fitting fallback removed; shortfall = STOP and escalate

plasma_subset:
  source: UPENN_PLASMA_FUJIREBIO_QUANTERIX
  members_of: analysis_cohort
  ptau217_within_days: 365

tiers:
  aim1: {confirmatory_n: 462, raised_effect_n: 258, stop_below: 258}   # r=0.15 / 0.20, alpha 0.05/3, power 0.80
  aim2: {min_confirmed_events: 69}   # Schoenfeld, HR 1.5/SD, VIF 1.43
  aim3_reserve: EXPLORATORY_unless_theorist_shows_powered

identifiers:
  join_keys:
    APOERES: [RID]  # APOE is not joined by visit or date
  participant:
    UCSFFSX7: RID
    UCBERKELEY_AMY_6MM: RID
    UCBERKELEY_TAU_6MM: RID
    UWNPSYCHSUM: RID
    ADSP_PHC_COGN: RID
    CDR: RID
    DXSUM: RID
    PTDEMOG: RID
    AMYQC: RID
    APOERES: RID
    UPENN_PLASMA_FUJIREBIO_QUANTERIX: RID
  visit:
    UCSFFSX7: VISCODE2
    UCBERKELEY_AMY_6MM: VISCODE2
    UCBERKELEY_TAU_6MM: VISCODE2
    UWNPSYCHSUM: VISCODE2
    ADSP_PHC_COGN: VISCODE2
    CDR: VISCODE2
    DXSUM: VISCODE2
    PTDEMOG: VISCODE2
    AMYQC: VISCODE2
    APOERES: VISCODE
    UPENN_PLASMA_FUJIREBIO_QUANTERIX: VISCODE2
  date:
    UCSFFSX7: EXAMDATE
    UCBERKELEY_AMY_6MM: SCANDATE
    UCBERKELEY_TAU_6MM: SCANDATE
    UWNPSYCHSUM: EXAMDATE
    ADSP_PHC_COGN: EXAMDATE
    CDR: VISDATE
    DXSUM: EXAMDATE
    PTDEMOG: VISDATE
    AMYQC: SCANDATE
    APOERES: APTESTDT
    UPENN_PLASMA_FUJIREBIO_QUANTERIX: EXAMDATE
  phase:
    source: UCSFFSX7
    column: PHASE
    record: selected_mri_row
    freesurfer_version_column: FSVER
    derive_pet_phase: false
  row_id:
    source: original_csv_row_position
    order: ascending

brain_age_model:                     # X4 gate (build phase)
  features: DEFINED_AT_X3            # MRIs lost to missing features are re-counted and reported (D-011)
  candidates_in_order: [ridge, gradient_boosting]   # first to pass X4 is used; selection on held-out age prediction only, never outcomes
  on_x4_fail_all: STOP_AND_ESCALATE
  mae_max_years: 4.5
  mae_max_ratio_to_null: 0.75        # null MAE computed in the held-out set
  bias: {abs_slope_max: 0.05, abs_r_max: 0.10}
